<!doctype html>
<html><head><meta charset="utf-8"><title>stickman</title>
<style>html,body{margin:0;height:100%;background:#000;display:flex;align-items:center;justify-content:center}
canvas{height:100vh;width:auto}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="engine/stickman.js"></script>
<script>
// player.html?story=path/to/story.js   (default: the example)
const src = new URLSearchParams(location.search).get('story') || 'examples/the-seed/story.js';
const s = document.createElement('script');
s.src = src;
s.onload = () => SM.start(document.getElementById('c'));
s.onerror = () => document.body.insertAdjacentHTML('beforeend', '<p style="color:#fff;font:20px monospace">could not load ' + src + '</p>');
document.body.appendChild(s);
</script></body></html>
